name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, SQL integration and Angular
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/forjix-web/package-lock.json

      - name: Generate isolated CI credentials
        shell: bash
        run: |
          set -euo pipefail
          sql_password="Ci!$(openssl rand -hex 24)Aa1"
          admin_password="Ci!$(openssl rand -hex 24)Bb2"
          jwt_key="$(openssl rand -hex 64)"
          echo "::add-mask::$sql_password"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$jwt_key"
          {
            echo "FORJIX_CI_SQL_PASSWORD=$sql_password"
            echo "FORJIX_CI_ADMIN_PASSWORD=$admin_password"
            echo "FORJIX_RUN_SQL_TESTS=true"
            echo "DOTNET_ENVIRONMENT=CI"
            echo "ASPNETCORE_ENVIRONMENT=CI"
            echo "ConnectionStrings__ForjixMaster=Server=localhost,14333;Database=ForjixMaster_CI;User Id=sa;Password=$sql_password;TrustServerCertificate=True"
            echo "TenantDatabases__EmpresaA_CI=Server=localhost,14333;Database=Forjix_EmpresaA_CI;User Id=sa;Password=$sql_password;TrustServerCertificate=True"
            echo "TenantDatabases__EmpresaB_CI=Server=localhost,14333;Database=Forjix_EmpresaB_CI;User Id=sa;Password=$sql_password;TrustServerCertificate=True"
            echo "Forjix__IntegrationSeed__Enabled=true"
            echo "Forjix__IntegrationSeed__AdminPassword=$admin_password"
            echo "Jwt__SigningKey=$jwt_key"
          } >> "$GITHUB_ENV"

      - name: Restore .NET
        run: dotnet restore Forjix.sln

      - name: Build .NET
        run: dotnet build Forjix.sln --configuration Release --no-restore

      - name: Run unit and HTTP boundary tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Forjix.Domain.Tests/Forjix.Domain.Tests.csproj --configuration Release --no-build
          dotnet test tests/Forjix.Application.Tests/Forjix.Application.Tests.csproj --configuration Release --no-build
          dotnet test tests/Forjix.IntegrationTests/Forjix.IntegrationTests.csproj --configuration Release --no-build --filter "Category!=SqlIntegration"

      - name: Start SQL Server 2022
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name forjix-sql-ci \
            --env ACCEPT_EULA=Y \
            --env MSSQL_PID=Developer \
            --env MSSQL_SA_PASSWORD="$FORJIX_CI_SQL_PASSWORD" \
            --publish 14333:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if docker exec forjix-sql-ci /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$FORJIX_CI_SQL_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs forjix-sql-ci
          exit 1

      - name: Apply migrations and seed twice
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tools/Forjix.DatabaseMigrator --configuration Release --no-build
          dotnet run --project tools/Forjix.DatabaseMigrator --configuration Release --no-build

      - name: Run real SQL Server integration tests
        run: dotnet test tests/Forjix.IntegrationTests/Forjix.IntegrationTests.csproj --configuration Release --no-build --filter "Category=SqlIntegration"

      - name: Install Angular dependencies
        working-directory: web/forjix-web
        run: npm ci

      - name: Build Angular production bundle
        working-directory: web/forjix-web
        run: npm run build

      - name: Stop SQL Server
        if: always()
        shell: bash
        run: |
          if docker container inspect forjix-sql-ci >/dev/null 2>&1; then
            docker rm --force forjix-sql-ci >/dev/null
          fi
