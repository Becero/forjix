name: forjix-development

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: forjix-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${FORJIX_SQL_PASSWORD:?Define FORJIX_SQL_PASSWORD in the local .env file}
    ports:
      - "14333:1433"
    volumes:
      - forjix-sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  forjix-sql-data:
