<section class="page"><div class="page-heading"><div><span class="eyebrow">ADMINISTRAÇÃO</span><h1>Configurações</h1><p>Identidade e regras operacionais da empresa.</p></div></div><form class="content-card settings-form" [formGroup]="form" (ngSubmit)="save()"><div class="settings-section"><div><h2>Dados da empresa</h2><p>Informações usadas nas telas e documentos gerenciais.</p></div><div class="settings-fields"><label class="field"><span>Nome fantasia</span><input formControlName="tradeName"></label><label class="field"><span>Razão social</span><input formControlName="legalName"></label><label class="field"><span>CNPJ</span><input formControlName="cnpj" brDataMask="cnpj"><small class="error" *ngIf="form.controls.cnpj.touched&&form.controls.cnpj.invalid">Informe o CNPJ completo.</small></label><label class="field"><span>Telefone</span><input formControlName="phone" brDataMask="phone"><small class="error" *ngIf="form.controls.phone.touched&&form.controls.phone.invalid">Informe DDD e telefone com 10 ou 11 dígitos.</small></label><label class="field"><span>E-mail</span><input formControlName="email"></label><label class="field"><span>Fuso horário</span><input formControlName="timeZone"></label><label class="field wide"><span>Endereço</span><textarea formControlName="address"></textarea></label></div></div><div class="settings-section"><div><h2>Operação</h2><p>Regras sensíveis aplicadas pelo backend.</p></div><div class="settings-fields"><label class="check wide"><input type="checkbox" formControlName="allowNegativeStock"> Permitir estoque negativo</label><label class="field"><span>Moeda</span><input formControlName="currency" readonly></label><label class="field" *ngIf="canManage"><span>Logo (PNG, JPEG ou WebP)</span><input type="file" accept="image/png,image/jpeg,image/webp" (change)="upload($event)"><small *ngIf="hasLogo()">Logo armazenada com segurança.</small></label></div></div><p class="error" *ngIf="error()">{{error()}}</p><p class="success" *ngIf="saved()">Configurações salvas.</p><div class="settings-footer" *ngIf="canManage"><button class="btn primary">Salvar alterações</button></div></form></section>
