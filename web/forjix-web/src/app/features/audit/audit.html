<section class="page"><div class="page-heading"><div><span class="eyebrow">SEGURANÇA</span><h1>Auditoria</h1><p>Registro das ações importantes realizadas neste ambiente.</p></div></div><form class="content-card toolbar" [formGroup]="filters" (ngSubmit)="load()"><select formControlName="userId"><option value="">Todos os usuários</option><option *ngFor="let user of users()" [value]="user.id">{{ user.name }}</option></select><select formControlName="action"><option value="">Todas as ações</option><option>Created</option><option>Updated</option><option>PermissionChanged</option><option>LoginSucceeded</option><option>LoginFailed</option><option>Logout</option></select><select formControlName="entity"><option value="">Todas as entidades</option><option>User</option><option>Role</option><option>Category</option><option>Product</option></select><input type="date" formControlName="from"><input type="date" formControlName="to"><button class="btn primary">Atualizar</button></form><br><div class="content-card table-wrap"><table><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Entidade</th><th>Identificador</th><th>Detalhes</th></tr></thead><tbody><tr *ngFor="let item of items()"><td>{{ item.occurredAt | date:'dd/MM/yyyy HH:mm:ss' }}</td><td>{{ item.userName || 'Sistema' }}</td><td><span class="chip">{{ item.action }}</span></td><td>{{ item.entity }}</td><td><small>{{ item.entityId || '—' }}</small></td><td><small>{{ detail(item) }}</small></td></tr></tbody></table></div></section>
