<div class="modal-backdrop"><form class="modal" [formGroup]="form" (ngSubmit)="submit()"><div class="modal-header"><div><span class="eyebrow">MOVIMENTAÇÃO</span><h2>{{ item.productName }}</h2><small>{{ item.sku }}</small></div><button type="button" (click)="closed.emit()">×</button></div><div class="modal-body"><div class="inventory-summary wide"><span>Saldo atual<strong>{{ item.quantity }}</strong></span><span>Movimento<strong [class.negative]="delta < 0">{{ delta > 0 ? '+' : '' }}{{ delta }}</strong></span><span>Novo saldo<strong [class.negative]="projected < 0">{{ projected }}</strong></span></div><div class="field"><label>Tipo</label><select formControlName="type"><option value="StockEntry">Entrada</option><option value="StockExit">Saída</option><option value="PositiveAdjustment">Ajuste positivo</option><option value="NegativeAdjustment">Ajuste negativo</option></select></div><div class="field"><label>Quantidade</label><input type="number" min="0.001" step="0.001" formControlName="quantity"></div><div class="field wide"><label>Motivo / observação</label><textarea rows="3" maxlength="500" formControlName="reason"></textarea></div><p class="error wide" *ngIf="!allowNegativeStock && projected < 0">Saldo insuficiente. Esta empresa não permite estoque negativo.</p><p class="error wide" *ngIf="form.controls.type.value.includes('Adjustment') && !form.controls.reason.value.trim()">O motivo é obrigatório para ajustes.</p><p class="error wide" *ngIf="error">{{ error }}</p></div><div class="modal-footer"><button type="button" class="btn" (click)="closed.emit()">Cancelar</button><button class="btn primary" [disabled]="invalid || saving">{{ saving ? 'Salvando...' : 'Confirmar movimentação' }}</button></div></form></div>
