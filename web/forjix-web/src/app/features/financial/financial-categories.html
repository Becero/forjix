<section class="page"><div class="page-heading"><div><span class="eyebrow">FINANCEIRO</span><h1>Categorias financeiras</h1><p>Classifique receitas e despesas.</p></div><button class="btn primary" *ngIf="canManage" (click)="open()">+ Nova categoria</button></div>
<div class="content-card toolbar"><select [formControl]="filter" (change)="load()"><option value="">Todos os tipos</option><option value="Income">Receita</option><option value="Expense">Despesa</option></select></div><p class="error" *ngIf="error()">{{error()}}</p>
<div class="content-card table-wrap"><table><thead><tr><th>Nome</th><th>Tipo</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr *ngFor="let c of items()"><td>{{c.name}}</td><td>{{c.type==='Income'?'Receita':'Despesa'}}</td><td>{{c.isActive?'Ativa':'Inativa'}}</td><td><button class="btn small" *ngIf="canManage" (click)="open(c)">Editar</button></td></tr></tbody></table><div class="empty-state" *ngIf="!items().length">Nenhuma categoria encontrada.</div></div></section>
<div class="modal-backdrop" *ngIf="modal()"><form class="modal" [formGroup]="form" (ngSubmit)="save()"><div class="modal-header"><h2>{{editing()?'Editar':'Nova'}} categoria</h2><button type="button" (click)="modal.set(false)">×</button></div><div class="modal-body"><label class="field"><span>Nome</span><input formControlName="name" maxlength="120"></label><label class="field"><span>Tipo</span><select formControlName="type"><option value="Income">Receita</option><option value="Expense">Despesa</option></select></label><label class="check wide"><input type="checkbox" formControlName="isActive"> Categoria ativa</label><p class="error wide" *ngIf="error()">{{error()}}</p></div><div class="modal-footer"><button type="button" class="btn" (click)="modal.set(false)">Voltar</button><button class="btn primary" [disabled]="saving()||form.invalid">Salvar</button></div></form></div>
